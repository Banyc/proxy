[package]
name = "server"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "proxy"
path = "src/main.rs"

[dependencies]
ae = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true, features = ["derive"] }
common = { workspace = true }
dhat = { workspace = true, optional = true }
file_watcher_tokio = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
swap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The deterministic, seeded `sch_netem`-faithful impairment instrument, consumed
# through its **published tag** so the manifest resolves outside this checkout —
# a local path here is unresolvable on CI, where the sibling checkout does not
# exist. It impairs the chain's own RTP hop with the same instrument the
# tri-mandate arms use. Uncomment the path line to test against the local
# harness instead of the released one.
netem-test = { git = "https://github.com/Banyc/netem_test.git", tag = "v0.0.3", features = ["test-kit"] }
# netem-test = { path = "../../netem_test/netem-test", features = ["test-kit"] }
# The proxy chain's transport, so the same-load-shape direct-transport baseline
# can be built without a proxy in the path.
rtp_mux = { workspace = true }
serde_json = { workspace = true }
# The relay-stack attribution arms configure the proxy's own relay
# (`common::proxy_runtime::relay::copy::timed_copy_bidirectional`) with the
# same unlimited limiter both proxy services configure, so they can measure
# that production relay's contribution on the direct transport without a proxy
# in the path.
async-speed-limit = { workspace = true }
# The `direct_proto` arm speaks the proxy protocol itself, so it needs the same
# header/payload key type the chain's config builds (`ConfigBuilder` -> blake3
# key) to derive the hop's obfuscation key and to sign its own relay header.
# Test-only: the server's production dependency set is unchanged.
tokio_chacha20 = { workspace = true }

[features]
default = []
dhat-heap = ["dhat"]

[lints.clippy]
disallowed_methods = "deny"
