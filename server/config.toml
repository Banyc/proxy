[stream.upstream]
# Each entry may define its own payload_key; chains nest all configured layers.
# Keys are unpadded-base64 strings: `printf secret | base64 | tr -d '='`.
"tcp1" = { address = "tcp://proxy.example.org:80", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }
"mptcp1" = { address = "mptcp://proxy.example.org:81", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }
"tcpmux1" = { address = "tcpmux://proxy.example.org:82", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }
"kcp1" = { address = "kcp://proxy.example.org:80", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }
"rtp1" = { address = "rtp://proxy.example.org:81", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }
"rtpmux1" = { address = "rtpmux://proxy.example.org:82", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }

# Reverse tunnels register on the public responder and become chain hops here.
# The virtual scheme matches the tunnel's physical transport (see
# [reverse_tunnel.*] below): revtuntcp://name <=> "tcp://…", revtunrtp://name <=> "rtpmux://…".
"private-a" = { address = "revtuntcp://private-a", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }
"private-b" = { address = "revtunrtp://private-b", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }

[stream]
pool = ["tcp1", "mptcp1"]

[udp.upstream]
"udp1" = { address = "proxy.example.org:80", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }
# The same tunnels carry UDP flows; each UDP access flow shares one framed mux substream.
"private-a" = { address = "revtuntcp://private-a", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }
"private-b" = { address = "revtunrtp://private-b", header_key = "cHJveHktZXhhbXBsZS1rZXk", payload_key = "cHJveHktZXhhbXBsZS1rZXk" }

[access_server.matcher]
"localhost" = [
    { addr = "127.0.0.1" }, # IPv4
    { addr = "::1" },       # IPv6
    { addr = "localhost" }, # domain name regex
]

[access_server.stream.conn_selector]
"default" = { chains = [
    { weight = 1, chain = ["tcp1"] },
    { weight = 1, chain = ["mptcp1"] },
    { weight = 1, chain = ["tcpmux1"] },
    { weight = 1, chain = ["kcp1"] },
    { weight = 1, chain = ["rtp1"] },
    { weight = 1, chain = ["rtpmux1"] },
    { weight = 1, chain = ["private-a"] }, # via reverse tunnel (TCP transport)
    { weight = 1, chain = ["private-b"] }, # via reverse tunnel (RTP transport)
# max_rtt_ratio: optional; exclude chains slower than N x the fastest route's RTT (needs probe_rtt = true). Unset = disabled.
# active_chains: optional; Unset = all chains active
# probe_rtt: the only source of RTT
], probe_rtt = false, active_chains = 8, max_rtt_ratio = 1.5 }

[access_server.stream.route_table]
"default" = [
    { matcher = "localhost", action = "direct" }, # Forward local traffic directly
                                                  # <- At this point, no more local traffic
    # { matcher = { }, action = "block" }, # Block all
    { matcher = { }, action = "default" }, # Forward remaining traffic to the "default" conn_selector above
]

[access_server.udp.conn_selector]
"default" = { chains = [
    { weight = 1, chain = ["udp1"] },
    { weight = 1, chain = ["private-a"] }, # via reverse tunnel (TCP transport)
    { weight = 1, chain = ["private-b"] }, # via reverse tunnel (RTP transport)
], probe_rtt = false, active_chains = 3, max_rtt_ratio = 1.5 }

[[access_server.tcp_server]]
listen_addr = "0.0.0.0:80"
destination = "tcp://www.example.org:80"
conn_selector = "default"                  # Or, `conn_selector = { chains = ..., probe_rtt = ..., ... }`
# speed_limit = 1024.0 # 1.0 KiB/s

[[access_server.udp_server]]
listen_addr = "0.0.0.0:80"
destination = "www.example.org:80"
conn_selector = "default"            # Or, `conn_selector = { chains = ..., probe_rtt = ..., ... }`
# speed_limit = 1024.0 # 1.0 KiB/s

[[access_server.http_server]]
listen_addr = "0.0.0.0:80"
route_table = "default"    # Or, `route_table = [...]`
# speed_limit = 1024.0 # 1.0 KiB/s

[[access_server.socks5_tcp_server]]
listen_addr = "0.0.0.0:80"
udp_server_addr = "0.0.0.0:80"
route_table = "default"        # Or, `route_table = [...]`
# speed_limit = 1024.0 # 1.0 KiB/s
# users = [
#     { username = "", password = "" },
# ]

[[access_server.socks5_udp_server]]
listen_addr = "0.0.0.0:80"
conn_selector = "default"    # Or, `conn_selector = { chains = ..., probe_rtt = ..., ... }`
# speed_limit = 1024.0 # 1.0 KiB/s

[[proxy_server.tcp_server]]
listen_addr = "0.0.0.0:80"
header_key = "cHJveHktZXhhbXBsZS1rZXk"
# payload_key = "cHJveHktZXhhbXBsZS1rZXk"

[[proxy_server.kcp_server]]
listen_addr = "0.0.0.0:80"
header_key = "cHJveHktZXhhbXBsZS1rZXk"
# payload_key = "cHJveHktZXhhbXBsZS1rZXk"

[[proxy_server.mptcp_server]]
listen_addr = "0.0.0.0:80"
header_key = "cHJveHktZXhhbXBsZS1rZXk"
# payload_key = "cHJveHktZXhhbXBsZS1rZXk"

[[proxy_server.rtp_server]]
listen_addr = "0.0.0.0:80"
header_key = "cHJveHktZXhhbXBsZS1rZXk"
# payload_key = "cHJveHktZXhhbXBsZS1rZXk"

[[proxy_server.udp_server]]
listen_addr = "0.0.0.0:80"
header_key = "cHJveHktZXhhbXBsZS1rZXk"
# payload_key = "cHJveHktZXhhbXBsZS1rZXk"

# Reverse tunnels: the private machine dials out and registers under a name;
# this public server accepts the registration, and the chain entries above hop
# through it. Responder and initiator share header_key; the optional payload_key
# is shared with the chain entry; fec (RTP transport only) matches on both sides.

# Public side (this server) — one responder per transport, no name or destination:
[[reverse_tunnel.responder]]
listen_addr = "tcp://0.0.0.0:7000"
header_key = "cHJveHktZXhhbXBsZS1rZXk"

[[reverse_tunnel.responder]]
listen_addr = "rtpmux://0.0.0.0:7100"
header_key = "cHJveHktZXhhbXBsZS1rZXk"
fec = false

# Private side (the machine behind NAT) — dials out to the responder above:
[[reverse_tunnel.initiator]]
name = "private-a"
responder_addr = "tcp://proxy.example.org:7000"
header_key = "cHJveHktZXhhbXBsZS1rZXk"
payload_key = "cHJveHktZXhhbXBsZS1rZXk"
allow_loopback = false

[[reverse_tunnel.initiator]]
name = "private-b"
responder_addr = "rtpmux://proxy.example.org:7100"
header_key = "cHJveHktZXhhbXBsZS1rZXk"
payload_key = "cHJveHktZXhhbXBsZS1rZXk"
fec = false
